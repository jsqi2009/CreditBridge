plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.credit.bridge'
    compileSdk 36

    defaultConfig {
        applicationId "com.mobile.credit.service.lineview.online"
        minSdk 24
        targetSdk 36
        versionCode 100
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        /*ndk {
            abiFilters 'armeabi' //,'x86', 'x86_64' //,  'arm64-v8a'
        }*/
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        dataBinding = true
        buildConfig = true
        viewBinding true
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    packaging {
        resources {
            excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.aar'], dir: 'libs')
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation "com.squareup.okhttp3:okhttp:5.3.2"
    implementation "com.squareup.okhttp3:logging-interceptor:5.3.2"
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup:otto:1.3.8'
    implementation 'org.apache.commons:commons-lang3:3.20.0'

    implementation 'com.dfsdk.liveness:df-liveness-action-sdk:2.2.8@aar'
    implementation 'com.liveness.dflivenesslibrary:df-liveness-action-ui:2.2.11@aar'
    implementation("pub.devrel:easypermissions:3.0.0")
    implementation("androidx.camera:camera-core:1.5.3")
    implementation("androidx.camera:camera-camera2:1.5.3")
    implementation("androidx.camera:camera-lifecycle:1.5.3")
    implementation("androidx.camera:camera-view:1.5.3")
    implementation("com.github.bumptech.glide:glide:5.0.5")
    //implementation ("com.aliyun.dpa:oss-android-sdk:2.9.21")
    implementation("io.github.lucksiege:compress:v3.11.2")
    implementation("com.appsflyer:af-android-sdk:6.17.5")
    implementation "com.android.installreferrer:installreferrer:2.2"
    implementation("com.google.android.gms:play-services-location:21.3.0")
    implementation "com.google.android.gms:play-services-ads-identifier:18.3.0"
    implementation "com.github.bumptech.glide:glide:4.16.0"
    implementation 'com.airbnb.android:lottie:6.7.1'


}